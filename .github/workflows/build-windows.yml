name: Build Windows Binary

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.35.2'
          channel: 'master'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Env and Code
        run: |
          Set-Content -Path .env -Value @"
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=""
          LASTFM_API_SECRET=""
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=0
          "@
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Runner (Release)
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: flutter build windows --release

      - name: Compress Windows Bundle
        run: |
          if (!(Test-Path -Path "dist")) { New-Item -ItemType Directory -Path "dist" }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Spectra-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-windows-x64
          path: dist/Spectra-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows Artifact to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Spectra-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
